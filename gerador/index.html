<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="Gerador de senha, Gerador de password, Criador de senhas seguras">
  <title>Gerador de Senha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img class="logo" src="./assets/logo.png" alt="Logo do Gerador de Senha">
  </header>

  <main class="container-input">
    <label for="slider">
      Tamanho: <span id="valor">15</span> caracteres
    </label>
    <input id="slider" class="slider" type="range" min="5" max="25" value="15">
    
    <button id="button" class="button-cta" onclick="generatePassword()">
      Gerar senha
    </button>
  </main>

  <section id="container-password" class="container-password hide">
    <span class="title">Sua senha gerada foi:</span>
    <span id="password" class="password" tabindex="0" role="textbox" aria-label="Senha gerada"></span>
    <span class="tooltip">Clique na senha para copiar 👆</span>
  </section>

  <script src="script.js"></script>
</body>
</html>
